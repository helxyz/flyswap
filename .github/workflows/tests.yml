name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check flyswap tests
      - name: Test
        # Synthetic fixtures only: CI never downloads a connectome.
        run: pytest -q
      - name: Smoke-test the pipeline
        run: flyswap all --data synthetic --out /tmp/results
